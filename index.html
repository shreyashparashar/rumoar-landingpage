    <script type="application/ld+json">

        "name": "RUMOAR",

        "description": "A digital concept store of curated objects, exclusive drops and everyday essentials.",

      }
    </script>

    <style>
      /* The ground is painted before React boots. Without this the first paint
         is a white flash under a page that is almost entirely dark — the one
         frame everybody notices. */
      html { background: #000000; }
      body { margin: 0; background: #000000; }
      /* Held by the boot sequence and released in JS, never by CSS alone: if
         the bundle fails to execute, the page must still scroll. */
      body.boot-lock { overflow: hidden; }
      /* No smooth scroll here. It fights every scrubbed section on the page. */
    </style>
  </head>
